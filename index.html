    <meta name="theme-color" content="#141225" media="(prefers-color-scheme: dark)" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tribely-theme');
          var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>Tribely — Find your tribe. Move together.</title>
